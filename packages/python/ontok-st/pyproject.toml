[project]
name = "ontok-st"
version = "0.1.0"
description = "Semantic Topology for ONTOK."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Kyle Tobin", email = "tobin.kyle@gmail.com" }]
dependencies = ["ontok-core>=0.1.0,<0.2.0"]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
ontok-core = { workspace = true }

[tool.uv.build-backend]
module-name = "ontok.st"
